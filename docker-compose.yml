services:
  db:
    image: mariadb:10.11
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:latest
    container_name: portfolio_wp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/flavia-portfolio:/var/www/html/wp-content/themes/flavia-portfolio
      - ./portfolio_original/paginas-wordpress:/var/www/html/paginas-wordpress:ro

  wpcli:
    image: wordpress:cli
    container_name: portfolio_wpcli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/flavia-portfolio:/var/www/html/wp-content/themes/flavia-portfolio
      - ./portfolio_original/paginas-wordpress:/var/www/html/paginas-wordpress:ro
      - ./scripts:/scripts:ro

volumes:
  db_data:
  wp_data:
